[project]
name = "phishguard"
version = "0.1.0"
description = "Agentic, explainable, defensive phishing detector"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12.0",
    "idna>=3.7",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.8.0",
    "structlog>=24.1.0",
    "tldextract>=5.1.0",
]

[project.optional-dependencies]
llm = [
    "litellm==1.109.1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7.8",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "types-beautifulsoup4>=4.12.0",
    "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=phishguard --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["phishguard"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv"]

